<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: https://jsdelivr.net;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="card" src="https://jsdelivr.net" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
        
        <!-- Replaced the 3D model with a blue cube -->
        <a-box 
          color="blue" 
          position="0 0 0.1" 
          depth="0.2" 
          height="0.2" 
          width="0.2"
          animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
        </a-box>
       
    </a-scene>
  </body>
</html>
